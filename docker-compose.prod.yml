# Production stack on the VPS: gateway + one serving host (guard + ollama).
# The web UI is served by Vercel, which has its own Postgres — the box no longer
# runs a copy. Vercel reaches the gateway on :4121; guard stays localhost-only.
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tor}
      - POSTGRES_USER=${POSTGRES_USER:-tor}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env.prod}
    volumes:
      - pg-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0

  guard:
    build: ./host-runner/guard
    ports:
      - "127.0.0.1:4122:4122" # localhost only, same as gateway
    environment:
      - HOST_WALLET=${HOST_WALLET:-}
      - UPSTREAM_URL=http://ollama:11434
      - GUARD_PORT=4122
      - X402_TESTNET_FACILITATOR_URL=${X402_TESTNET_FACILITATOR_URL:-https://api.testnet.blocky402.com}
    depends_on:
      - ollama

  gateway:
    build: ./gateway
    ports:
      - "4121:4121" # public for the Vercel frontend (chat key-gated, admin token-gated)
    environment:
      - PORT=4121
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tor}:${POSTGRES_PASSWORD:?set in .env.prod}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB:-tor}?sslmode=no-verify
      - UPSTREAM_URL=http://ollama:11434
      - HOSTS_JSON=${HOSTS_JSON:-}
      - REGISTRY=${REGISTRY:-}
      - LEGACY_REGISTRIES=${LEGACY_REGISTRIES:-}
      - TAP_REGISTRY=${TAP_REGISTRY:-${REGISTRY:-}}
      - RPC_URL=${RPC_URL:-https://testnet.hashio.io/api}
      - MODELS=${MODELS:-qwen2.5:0.5b}
      - VAULT_ADDRESS=${VAULT_ADDRESS:-}
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?set in .env.prod}
      - TAP_HEDERA_ACCOUNT=${TAP_HEDERA_ACCOUNT:-}
      - MIRROR_URL=${MIRROR_URL:-https://testnet.mirrornode.hedera.com}
      # Ring on a fresh VPS has no trustchain member (no USB), so production
      # runs env-fallback: secrets below. The ring path is demoed from the
      # laptop (see LEDGER-WALKTHROUGH.md) — same code, different backend.
      - PRIVY_APP_ID=${NEXT_PUBLIC_PRIVY_APP_ID:?set in .env.prod}
      - PRIVY_APP_SECRET=${PRIVY_APP_SECRET:?set in .env.prod}
      - BUDGET_MASTER=${BUDGET_MASTER:?set in .env.prod}
      - OPERATOR_KEY=${OPERATOR_KEY:-}
      - FAUCET_ACCOUNT_ID=${FAUCET_ACCOUNT_ID:-}
      - FAUCET_PRIVATE_KEY=${FAUCET_PRIVATE_KEY:-}
      - FAUCET_DAILY_GRANTS=${FAUCET_DAILY_GRANTS:-10}
      - X402_PAYER_ID=${X402_PAYER_ID:-}
      - X402_PAYER_KEY=${X402_PAYER_KEY:-}
      - X402_MAX_PAYMENT_UNITS=${X402_MAX_PAYMENT_UNITS:-10000}
      - X402_DAILY_CAP_UNITS=${X402_DAILY_CAP_UNITS:-2000000}
      - X402_DAILY_PAYMENTS=${X402_DAILY_PAYMENTS:-2000}
      - HCS_TOPIC_ID=${HCS_TOPIC_ID:-}
      - HCS_OPERATOR_ID=${HCS_OPERATOR_ID:-}
      - HCS_OPERATOR_KEY=${HCS_OPERATOR_KEY:-}
      - HOST_KEY=${HOST_KEY:-}
      # Team treasury: broker authorization key (P-256, base64 PKCS8) that co-owns
      # every team wallet quorum with the team's financial approver.
      - PRIVY_BROKER_AUTH_KEY=${PRIVY_BROKER_AUTH_KEY:-}
      - TEAM_PLAN_IDS=${TEAM_PLAN_IDS:-0}
      - TEAM_PAYOUT_CAP_HBAR=${TEAM_PAYOUT_CAP_HBAR:-25}
      - TEAM_PAYOUT_CAP_USDC=${TEAM_PAYOUT_CAP_USDC:-5}
    volumes:
      - gateway-data:/app/.data
    depends_on:
      - guard
      - db

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  pg-data:
  ollama-data:
  gateway-data:
  caddy-data:
