services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # GPUs: base runs CPU-only everywhere. Linux+NVIDIA adds -f docker-compose.gpu.yml.

  guard:
    build: ./guard
    ports:
      - "4122:4122"
    environment:
      # Empty HOST_WALLET = dev mode (x402 gate off). Set to host account id for paid serving.
      - HOST_WALLET=${HOST_WALLET:-}
      # Point at a host-native Ollama when the containerised one is too slow
      # (Docker Desktop on macOS has no GPU access): http://host.docker.internal:11435
      - UPSTREAM_URL=${UPSTREAM_URL:-http://ollama:11434}
      - GUARD_PORT=4122
      - X402_TESTNET_FACILITATOR_URL=${X402_TESTNET_FACILITATOR_URL:-https://api.testnet.blocky402.com}
    depends_on:
      - ollama

volumes:
  ollama-data:
