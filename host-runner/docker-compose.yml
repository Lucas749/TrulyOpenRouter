services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  guard:
    build: ./guard
    ports:
      - "4122:4122"
    environment:
      - HOST_WALLET=${HOST_WALLET:?set HOST_WALLET (host Hedera account id)}
      - UPSTREAM_URL=http://ollama:11434
      - GUARD_PORT=4122
      - X402_TESTNET_FACILITATOR_URL=${X402_TESTNET_FACILITATOR_URL:-https://api.testnet.blocky402.com}
    depends_on:
      - ollama

volumes:
  ollama-data:
